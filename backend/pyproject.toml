[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osseo-dxa-inference"
version = "0.1.0"
description = "Osseo AI research inference service for total-body DXA landmarks"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi==0.116.1",
  "numpy==1.24.3",
  "pillow==9.4.0",
  "pydicom[pixeldata]==3.0.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
