name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions syntax and runner labels
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz' | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --extra test --locked
      - run: uv run --project backend --extra test --locked python -m pytest -q backend/tests

  competition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: ./competition/run.sh build
      - run: ./competition/run.sh test
      - name: Deployment failure and rollback tests
        run: docker run --rm --network none osseo-dxaqc:1.12.0 python -m pytest -q -p no:cacheprovider ops/tests
      - name: Real offline HTTP acceptance and managed deployment
        run: |
          python3 competition/ops/deploy.py deploy --image osseo-dxaqc:1.12.0 --state "$RUNNER_TEMP/dxaqc-deployment" --name dxaqc-ci --port 8093
          python3 competition/ops/deploy.py status --state "$RUNNER_TEMP/dxaqc-deployment" --name dxaqc-ci
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/dxaqc-deployment/runs/*/*.json
          if-no-files-found: warn
      - name: Cleanup own container
        if: always()
        run: docker rm -f dxaqc-ci || true
